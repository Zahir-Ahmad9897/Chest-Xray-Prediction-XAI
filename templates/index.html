<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chest X-Ray Pneumonia — XAI Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="stylesheet" href="/static/css/custom.css">
<style>
  [x-cloak] { display: none !important; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<!-- Skip link for WCAG -->
<a href="#main-content" class="skip-link">Skip to main content</a>

<div x-data="xaiApp()" x-init="init()" class="max-w-6xl mx-auto px-4 py-8">

  <!-- Header -->
  <header class="mb-8">
    <h1 class="text-2xl font-semibold text-slate-700">Chest X-Ray Pneumonia Classification</h1>
    <p class="text-slate-500 mt-1">Upload a chest X-ray to get a prediction with explainable AI visualizations.</p>
  </header>

  <main id="main-content">

    <!-- Upload Area -->
    <section aria-label="Image upload" class="mb-6">
      <div
        @dragover.prevent="dragging = true"
        @dragleave.prevent="dragging = false"
        @drop.prevent="handleDrop($event)"
        :class="dragging ? 'border-blue-400 bg-blue-50' : 'border-slate-300 bg-white'"
        class="border-2 border-dashed rounded-xl p-10 text-center cursor-pointer transition-colors"
        @click="$refs.fileInput.click()"
        role="button" tabindex="0" aria-label="Upload chest X-ray image"
        @keydown.enter="$refs.fileInput.click()"
      >
        <input type="file" x-ref="fileInput" accept="image/*" class="hidden"
               @change="handleFile($event.target.files[0])" aria-label="Choose file">
        <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <p class="mt-3 text-slate-600">Drag &amp; drop a chest X-ray image here, or click to browse</p>
        <p class="text-sm text-slate-400 mt-1" x-show="fileName">Selected: <span x-text="fileName"></span></p>
      </div>
    </section>

    <!-- Method Selector -->
    <section aria-label="XAI method selection" class="mb-6">
      <fieldset class="border border-slate-200 rounded-xl p-4 bg-white">
        <legend class="text-sm font-medium text-slate-600 px-2">Explanation Methods</legend>
        <div class="flex flex-wrap gap-4 mt-2">
          <template x-for="m in allMethods" :key="m.id">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" :value="m.id" x-model="selectedMethods"
                     class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
              <span class="text-sm text-slate-700" x-text="m.label"></span>
            </label>
          </template>
        </div>
      </fieldset>
    </section>

    <!-- Action Buttons -->
    <div class="flex gap-3 mb-8">
      <button @click="analyze()"
              :disabled="loading || !imageFile"
              class="px-6 py-2.5 bg-blue-600 text-white rounded-lg font-medium
                     hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed
                     focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 transition"
              aria-busy="loading">
        <span x-show="!loading">Analyze</span>
        <span x-show="loading" aria-hidden="true">Analyzing…</span>
      </button>
    </div>

    <!-- Error -->
    <div x-show="error" x-cloak
         class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"
         role="alert">
      <span x-text="error"></span>
    </div>

    <!-- Results -->
    <section x-show="result" x-cloak aria-label="Results">

      <!-- Prediction Card -->
      <div class="bg-white rounded-xl border border-slate-200 p-6 mb-6">
        <h2 class="text-lg font-semibold text-slate-700 mb-3">Prediction</h2>
        <div class="flex items-center gap-4">
          <span class="text-3xl font-bold"
                :class="result?.prediction?.label === 1 ? 'text-red-600' : 'text-emerald-600'"
                x-text="result?.prediction?.label_name"></span>
          <div class="flex-1">
            <div class="w-full bg-slate-200 rounded-full h-3">
              <div class="h-3 rounded-full transition-all duration-500"
                   :class="result?.prediction?.label === 1 ? 'bg-red-500' : 'bg-emerald-500'"
                   :style="'width:' + ((result?.prediction?.probability || 0) * 100) + '%'"></div>
            </div>
            <p class="text-sm text-slate-500 mt-1">
              Confidence: <span x-text="(result?.prediction?.probability * 100).toFixed(1)"></span>%
            </p>
          </div>
        </div>
      </div>

      <!-- XAI Gallery -->
      <h2 class="text-lg font-semibold text-slate-700 mb-3">Explanations</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="(b64, method) in result?.explanations" :key="method">
          <div x-show="b64" class="bg-white rounded-xl border border-slate-200 p-3">
            <p class="text-sm font-medium text-slate-600 mb-2 capitalize" x-text="method.replace('_',' ')"></p>
            <img :src="'data:image/jpeg;base64,' + b64" :alt="method + ' explanation'"
                 class="w-full rounded-lg">
          </div>
        </template>
      </div>
    </section>

  </main>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
